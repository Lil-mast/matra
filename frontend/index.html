        /* Toast notification styles */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #001f29;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.15);
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
